<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SafeExam – Key Validierung</title>

<style>
:root {
    --violet: #6f63c6;
    --violet-light: #f4f3fb;
    --border: #e2e0f2;
}

body {
    margin: 0;
    height: 100vh;
    background: var(--violet-light);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #333;
}

.box {
    background: white;
    padding: 40px;
    width: 380px;
    border-radius: 14px;
    border: 1px solid var(--border);
    text-align: center;
}

h2 {
    color: var(--violet);
    font-weight: 500;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 20px;
}

input:focus {
    outline: none;
    border-color: var(--violet);
}

button {
    width: 100%;
    padding: 14px;
    background: var(--violet);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #5d52b3;
}

.message {
    margin-top: 15px;
    font-size: 14px;
}
.error {
    color: #b91c1c;
}
.success {
    color: #166534;
}
</style>
</head>

<body>

<div class="box">
    <h2>SafeExam Lizenz-Key</h2>
    <input type="text" id="keyInput" placeholder="SafeExam-XXXXXXXXXXXX">
    <button onclick="checkKey()">Continue</button>
    <div class="message" id="message"></div>
</div>

<script>
async function checkKey() {
    const input = document.getElementById("keyInput").value.trim();
    const message = document.getElementById("message");

    message.textContent = "";
    message.className = "message";

    // 1) Format-Check (nur für UX)
    const keyPattern = /^SafeExam-[A-Za-z0-9]{12}$/;
    if (!keyPattern.test(input)) {
        message.textContent = "Ungültiges Key-Format.";
        message.classList.add("error");
        return;
    }

    try {
        // 2) Anfrage an Render-Server
        const response = await fetch(
            "https://safeexam-server.onrender.com",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ key: input })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            message.textContent = data.msg || "Key ungültig oder bereits benutzt.";
            message.classList.add("error");
            return;
        }

        message.textContent = "Key akzeptiert. Weiterleitung…";
        message.classList.add("success");

        setTimeout(() => {
            window.location.href = "download.html";
        }, 800);

    } catch (err) {
        message.textContent = "Server nicht erreichbar.";
        message.classList.add("error");
    }
}
</script>

</body>
</html>
